<div class="chat-container">
  <header class="chat-header">
    <div class="header-icon">🏪</div>
    <div class="header-text">
      <h1>Northwind Assistant</h1>
      <p>Powered by RAG + GPT-4</p>
    </div>
  </header>

  <div class="messages-container" #messagesContainer>
    <div
      *ngFor="let msg of messages"
      class="message"
      [class.user-message]="msg.role === 'user'"
      [class.assistant-message]="msg.role === 'assistant'"
    >
      <div class="message-bubble">
        <p *ngIf="msg.role === 'user'" class="message-content">{{ msg.content }}</p>
        <div *ngIf="msg.role === 'assistant'" class="message-content markdown-body" [innerHTML]="msg.content | markdown"></div>
        <div *ngIf="msg.sources && msg.sources.length > 0" class="sources">
          <span class="sources-label">Sources:</span>
          <span *ngFor="let source of msg.sources" class="source-tag">{{ source }}</span>
        </div>
        <span class="message-time">{{ msg.timestamp | date:'HH:mm' }}</span>
      </div>
    </div>

    <div *ngIf="isLoading" class="message assistant-message">
      <div class="message-bubble loading-bubble">
        <div class="typing-indicator">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="errorMessage" class="error-bar">
    {{ errorMessage }}
  </div>

  <div class="input-area">
    <textarea
      [(ngModel)]="userInput"
      (keypress)="onKeyPress($event)"
      placeholder="Ask about products, customers, orders..."
      [disabled]="isLoading"
      rows="1"
    ></textarea>
    <button
      (click)="sendMessage()"
      [disabled]="isLoading || !userInput.trim()"
      class="send-btn"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
</div>
